server:
  servlet:
    context-path: /
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cal-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

calcom:
  api:
    base-url: https://api.cal.com
    key: ${CALCOM_API_KEY}
    version-v1: 2024-06-14
    version-v2: 2024-08-13

monolith:
  api:
    base-url: ${MONOLITH_BASE_URL:http://localhost:8081}
    token: ${MONOLITH_API_TOKEN:}
    advertisements-path: ${MONOLITH_ADVERTISEMENTS_PATH:/v1/advertisements}

auth-service:
  base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:9000/api}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081/api}

scheduler:
  sync:
    cron: ${SYNC_CRON:0 */5 * * * *}
    enabled: ${SYNC_ENABLED:true}

rabbitmq:
  queues:
    estate-changed: ${RABBITMQ_QUEUE_ESTATE_CHANGED:cal-service.estate-changed}
  exchanges:
    estate: ${RABBITMQ_EXCHANGE_ESTATE:estate.exchange}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
  api-docs:
    enabled: true
    path: /api-docs

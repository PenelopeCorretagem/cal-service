server:
  servlet:
    context-path: /
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cal-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

app:
  security:
    token:
      secret: ${JWT_API_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}

calcom:
  api:
    base-url: https://api.cal.com
    key: ${CALCOM_API_KEY}
    version-v1: 2024-06-14
    version-v2: 2024-08-13

monolith:
  api:
    base-url: ${MONOLITH_BASE_URL:http://localhost:8081}
    token: ${MONOLITH_API_TOKEN:}
    estates-path: ${MONOLITH_ESTATES_PATH:/api/empreendimentos}

scheduler:
  sync:
    cron: ${SYNC_CRON:0 */5 * * * *}
    enabled: ${SYNC_ENABLED:true}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
  api-docs:
    enabled: true
    path: /api-docs
